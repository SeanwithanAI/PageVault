# Builds the PageVault image and publishes it to GitHub's container registry
# every time PageVault itself changes on main:
#   ghcr.io/seanwithanai/pagevault:latest           (always the newest)
#   ghcr.io/seanwithanai/pagevault:<version>        (e.g. 2026-11-16-mk1, to pin or roll back)
# TrueNAS and Docker see the new "latest" and offer the update.
name: Publish image

on:
  push:
    branches: [main]
    paths:
      - server.py
      - static/**
      - Dockerfile
      - .github/workflows/docker-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from server.py
        id: v
        run: |
          v=$(sed -nE 's/^VERSION = "([^"]+)".*/\1/p' server.py | tr ' ' '-')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/seanwithanai/pagevault:latest
            ghcr.io/seanwithanai/pagevault:${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.v.outputs.version }}

      - name: Check the image can be downloaded without signing in
        run: |
          t=$(curl -fsS "https://ghcr.io/token?scope=repository:seanwithanai/pagevault:pull" | jq -r .token)
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $t" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            https://ghcr.io/v2/seanwithanai/pagevault/manifests/latest)
          echo "Anonymous download check: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::The image is private. On GitHub: your profile > Packages > pagevault > Package settings > Change visibility > Public."
            exit 1
          fi

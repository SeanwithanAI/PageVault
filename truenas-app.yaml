# PageVault for TrueNAS SCALE (24.10 or newer)
# New install:  Apps -> Discover Apps -> ⋮ (top right) -> Install via YAML -> paste this file.
# Existing app: Apps -> Installed -> pagevault -> Edit -> replace the YAML with this file.
#
# Updates: when a new PageVault is released, TrueNAS shows "Update available" on the app.
# Click it, then Update. Your apps and data are never touched.
#
# Paths are set for this server:  Storage/Configs/PageVault/{apps,data}
# To use other datasets, change the LEFT side of each "volumes" line only.
services:
  pagevault:
    image: ghcr.io/seanwithanai/pagevault:latest   # ready-made PageVault image, rebuilt on every release
    user: "568:568"                    # TrueNAS built-in "apps" user
    restart: unless-stopped
    ports:
      - "8090:8080"                    # open http://<truenas-ip>:8090
    environment:
      TZ: America/Chicago
      MAX_UPLOAD_MB: "100"             # largest app upload
      STORE_QUOTA_MB: "200"            # saved data allowed per person
      COOKIE_SECURE: "0"               # set to "1" if you serve it over HTTPS
    volumes:
      # <dataset path on TrueNAS>:<path inside the app>   (no spaces)
      - /mnt/Storage/Configs/PageVault/apps:/apps      # uploaded HTML apps
      - /mnt/Storage/Configs/PageVault/data:/data      # accounts + saved data — snapshot this
